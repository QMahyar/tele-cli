name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            osname: win
            arch: x64
            ext: ".exe"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            osname: linux
            arch: x64-gnu
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            osname: linux
            arch: x64-musl
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            osname: linux
            arch: arm64-gnu
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            osname: linux
            arch: arm64-musl
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            osname: mac
            arch: arm64
            ext: ""
          # macOS x64 cross-compiled on arm64 runner (Apple clang supports both archs).
          - os: macos-latest
            target: x86_64-apple-darwin
            osname: mac
            arch: x64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain (linux x64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross toolchain (linux arm64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install cross toolchain (linux arm64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y curl
          curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz -o musl-cross.tgz
          sudo tar -xzf musl-cross.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Name artifacts
        id: name
        shell: bash
        run: |
          BINARY="telecli-${{ steps.version.outputs.version }}-${{ matrix.osname }}-${{ matrix.arch }}"
          echo "binary=${BINARY}" >> "$GITHUB_OUTPUT"
          echo "binary_ext=${BINARY}${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Package binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/telecli${{ matrix.ext }}" \
             "${{ steps.name.outputs.binary_ext }}"

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${{ steps.name.outputs.binary_ext }}" \
              > "${{ steps.name.outputs.binary_ext }}.sha256"
          else
            shasum -a 256 "${{ steps.name.outputs.binary_ext }}" \
              > "${{ steps.name.outputs.binary_ext }}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.binary }}
          path: |
            ${{ steps.name.outputs.binary_ext }}
            ${{ steps.name.outputs.binary_ext }}.sha256
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog section
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              gsub(/[][]/, "", $0)
              if ($2 == ver) found = 1
            }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: artifacts/*

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage main package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p pkg-main/bin
          cp npm/bin/telecli.js pkg-main/bin/telecli.js
          jq --arg v "$VERSION" '.version = $v |
             .optionalDependencies = (.optionalDependencies | with_entries(.value = $v))' \
             npm/package.json > pkg-main/package.json

      - name: Stage platform packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          stage() {
            local id="$1" os="$2" cpu="$3" binary="$4" exe="$5"
            mkdir -p "pkg-${id}/bin"
            cp "artifacts/${binary}${exe}" "pkg-${id}/bin/telecli${exe}"
            chmod +x "pkg-${id}/bin/telecli${exe}" || true
            jq -n --arg v "$VERSION" --arg id "$id" --arg os "$os" --arg cpu "$cpu" \
              '{name: ("@qmahyar/telecli-" + $id),
                version: $v,
                description: ("telecli binary for " + $os + "-" + $cpu),
                license: "MIT",
                repository: {type: "git", url: "git+https://github.com/QMahyar/tele-cli.git"},
                os: [$os], cpu: [$cpu],
                files: ["bin/"]}' \
              > "pkg-${id}/package.json"
          }
          stage win32-x64       win32  x64   "telecli-${{ steps.version.outputs.version }}-win-x64"        ".exe"
          stage linux-x64-gnu   linux  x64   "telecli-${{ steps.version.outputs.version }}-linux-x64-gnu"   ""
          stage linux-x64-musl  linux  x64   "telecli-${{ steps.version.outputs.version }}-linux-x64-musl"  ""
          stage linux-arm64-gnu linux  arm64 "telecli-${{ steps.version.outputs.version }}-linux-arm64-gnu" ""
          stage linux-arm64-musl linux arm64 "telecli-${{ steps.version.outputs.version }}-linux-arm64-musl" ""
          stage darwin-arm64    darwin arm64 "telecli-${{ steps.version.outputs.version }}-mac-arm64"       ""
          stage darwin-x64      darwin x64   "telecli-${{ steps.version.outputs.version }}-mac-x64"         ""

      - name: Publish platform packages
        working-directory: .
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for dir in pkg-*/; do
            case "$dir" in pkg-main/) continue ;; esac
            echo "publishing ${dir}"
            (cd "$dir" && npm publish --access public)
          done

      - name: Publish main package
        working-directory: pkg-main
        run: npm publish --access public
