name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (native MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            continue-on-error: true
          # macOS (native, Apple clang builds both archs on the arm64 runner)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # Linux — cross-rs docker images carry the C cross-toolchain for libsql's SQLite
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            archive: tar.gz
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package binary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="telecli-${VERSION}-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/telecli"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN="${BIN}.exe"
          fi
          mkdir -p "dist/${NAME}"
          cp "${BIN}" "dist/${NAME}/"
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "${NAME}.zip" "${NAME}")
          else
            tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          fi
          echo "asset=dist/${NAME}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Checksum
        shell: bash
        run: |
          ASSET="dist/telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}"
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum "$(basename "$ASSET")" > "$(basename "$ASSET").sha256"
          else
            shasum -a 256 "$(basename "$ASSET")" > "$(basename "$ASSET").sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog section
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              gsub(/[][]/, "", $0)
              if ($2 == ver) found = 1
            }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: artifacts/*

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract binaries from archives
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p bins
          for f in artifacts/telecli-${VERSION}-*.tar.gz; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .tar.gz)
            tar -xzf "$f" -C artifacts
            cp "artifacts/${base}/telecli" "bins/${base}"
          done
          for f in artifacts/telecli-${VERSION}-*.zip; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .zip)
            unzip -o -j "$f" "*/telecli.exe" -d bins >/dev/null
            mv "bins/telecli.exe" "bins/${base}.exe"
          done
          ls -la bins

      - name: Stage main package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p pkg-main/bin
          cp npm/bin/telecli.js pkg-main/bin/telecli.js
          jq --arg v "$VERSION" '.version = $v |
             .optionalDependencies = (.optionalDependencies | with_entries(.value = $v))' \
             npm/package.json > pkg-main/package.json

      - name: Stage platform packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          stage() {
            local id="$1" os="$2" cpu="$3" triple="$4" exe="$5"
            local src="bins/telecli-${VERSION}-${triple}${exe}"
            if [ ! -f "$src" ]; then
              echo "skip ${id}: no binary at ${src} (build skipped)"
              return 0
            fi
            mkdir -p "pkg-${id}/bin"
            cp "$src" "pkg-${id}/bin/telecli${exe}"
            chmod +x "pkg-${id}/bin/telecli${exe}" || true
            jq -n --arg v "$VERSION" --arg id "$id" --arg os "$os" --arg cpu "$cpu" \
              '{name: ("@qmahyar/telecli-" + $id),
                version: $v,
                description: ("telecli binary for " + $os + "-" + $cpu),
                license: "MIT",
                repository: {type: "git", url: "git+https://github.com/QMahyar/tele-cli.git"},
                os: [$os], cpu: [$cpu],
                files: ["bin/"]}' \
              > "pkg-${id}/package.json"
          }
          stage win32-x64        win32  x64   x86_64-pc-windows-msvc        ".exe"
          stage linux-x64-gnu    linux  x64   x86_64-unknown-linux-gnu      ""
          stage linux-x64-musl   linux  x64   x86_64-unknown-linux-musl     ""
          stage linux-arm64-gnu  linux  arm64 aarch64-unknown-linux-gnu     ""
          stage linux-arm64-musl linux  arm64 aarch64-unknown-linux-musl    ""

      - name: Publish platform packages
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for dir in pkg-*/; do
            case "$dir" in pkg-main/) continue ;; esac
            echo "publishing ${dir}"
            (cd "$dir" && npm publish --access public)
          done

      - name: Publish main package
        working-directory: pkg-main
        run: npm publish --access public
