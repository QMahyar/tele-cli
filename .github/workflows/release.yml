name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (native MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            continue-on-error: true
          # macOS (native, Apple clang builds both archs on the arm64 runner)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # Linux — cross-rs docker images carry the C cross-toolchain for libsql's SQLite
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            archive: tar.gz
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package binary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="telecli-${VERSION}-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/telecli"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN="${BIN}.exe"
          fi
          mkdir -p "dist/${NAME}"
          cp "${BIN}" "dist/${NAME}/"
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "${NAME}.zip" "${NAME}")
          else
            tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          fi
          echo "asset=dist/${NAME}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Checksum
        shell: bash
        run: |
          ASSET="dist/telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}"
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum "$(basename "$ASSET")" > "$(basename "$ASSET").sha256"
          else
            shasum -a 256 "$(basename "$ASSET")" > "$(basename "$ASSET").sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/telecli-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog section
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              gsub(/[][]/, "", $0)
              if ($2 == ver) found = 1
            }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: artifacts/*

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Bundle all binaries into main npm package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p npm-bin-staging
          for f in artifacts/telecli-${VERSION}-*.tar.gz; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .tar.gz)
            triple=${base#telecli-${VERSION}-}
            tar -xzf "$f" -C artifacts
            cp "artifacts/${base}/telecli" "npm-bin-staging/telecli-${triple}"
          done
          for f in artifacts/telecli-${VERSION}-*.zip; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .zip)
            triple=${base#telecli-${VERSION}-}
            unzip -o -j "$f" "*/telecli.exe" -d npm-bin-staging >/dev/null
            mv "npm-bin-staging/telecli.exe" "npm-bin-staging/telecli-${triple}.exe"
          done
          ls -la npm-bin-staging
          mkdir -p pkg-main
          rm -rf npm/bin/telecli-* 2>/dev/null || true
          cp -r npm-bin-staging/* npm/bin/
          cp npm/bin/telecli.js pkg-main/bin/telecli.js 2>/dev/null || (mkdir -p pkg-main/bin && cp npm/bin/telecli.js pkg-main/bin/telecli.js)
          mkdir -p pkg-main/bin
          cp npm/bin/telecli-* pkg-main/bin/ 2>/dev/null || true
          cp npm/bin/telecli.js pkg-main/bin/telecli.js
          jq --arg v "$VERSION" '.version = $v' npm/package.json > pkg-main/package.json

      - name: Publish to npm
        working-directory: pkg-main
        run: npm publish --access public
