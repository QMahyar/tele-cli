name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (native MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            continue-on-error: true
          # macOS (native, Apple clang builds both archs on the arm64 runner)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # Linux — cross-rs docker images carry the C cross-toolchain for libsql's SQLite
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            archive: tar.gz
            cross: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@ece28a32f963c771852fb93994c89a8e0f016ea6 # cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Cargo.toml and CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          CHANGELOG_VERSION=$(grep -m1 '^## \[' CHANGELOG.md | sed 's/## \[\(.*\)\]/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "tag v$VERSION != Cargo.toml $CARGO_VERSION — bump Cargo.toml and re-tag" >&2
            exit 1
          fi
          if [ "$CHANGELOG_VERSION" != "$VERSION" ]; then
            echo "tag v$VERSION not at the top of CHANGELOG.md (head is $CHANGELOG_VERSION)" >&2
            exit 1
          fi

      - name: Package binary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="tele-${VERSION}-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/tele"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN="${BIN}.exe"
          fi
          mkdir -p "dist/${NAME}"
          cp "${BIN}" "dist/${NAME}/"
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "${NAME}.zip" "${NAME}")
          else
            tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          fi
          echo "asset=dist/${NAME}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Checksum
        shell: bash
        run: |
          ASSET="dist/tele-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}"
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum "$(basename "$ASSET")" > "$(basename "$ASSET").sha256"
          else
            shasum -a 256 "$(basename "$ASSET")" > "$(basename "$ASSET").sha256"
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: tele-${{ steps.version.outputs.version }}-${{ matrix.target }}.sbom.spdx.json
          upload-release-assets: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # main (v4 line)
        with:
          subject-path: dist/tele-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tele-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/tele-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/tele-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog section
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              gsub(/[][]/, "", $0)
              if ($2 == ver) found = 1
            }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: artifacts/*

  npm:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Bundle all binaries into main npm package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p npm-bin-staging
          for f in artifacts/tele-${VERSION}-*.tar.gz; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .tar.gz)
            triple=${base#tele-${VERSION}-}
            tar -xzf "$f" -C artifacts
            cp "artifacts/${base}/tele" "npm-bin-staging/tele-${triple}"
          done
          for f in artifacts/tele-${VERSION}-*.zip; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .zip)
            triple=${base#tele-${VERSION}-}
            unzip -o -j "$f" "*/tele.exe" -d npm-bin-staging >/dev/null
            mv "npm-bin-staging/tele.exe" "npm-bin-staging/tele-${triple}.exe"
          done
          ls -la npm-bin-staging
          mkdir -p pkg-main/bin
          rm -rf npm/bin/tele-* npm/bin/telecli-* 2>/dev/null || true
          cp -r npm-bin-staging/* pkg-main/bin/
          cp npm/bin/tele.js pkg-main/bin/tele.js
          jq --arg v "$VERSION" '.version = $v' npm/package.json > pkg-main/package.json

      - name: Publish to npm
        working-directory: pkg-main
        run: npm publish --access public
