[package]
name = "telecli"
version = "0.6.1"
edition = "2021"
rust-version = "1.89"
description = "Telegram user-account CLI — messages, chats, groups, contacts, privacy, live streaming. No bot tokens."
license = "MIT"
repository = "https://github.com/QMahyar/tele-cli"
homepage = "https://github.com/QMahyar/tele-cli#readme"
keywords = ["telegram", "cli", "mtproto", "messaging", "chat"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
grammers-client = { version = "0.10", features = ["proxy", "parse_invite_link", "markdown", "fs"] }
grammers-crypto = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
getrandom = { version = "0.2" }
hmac = { version = "0.13", default-features = false }
rand = "0.10"
libsql = { version = "=0.9.30", default-features = false, features = ["core"] }
log = "0.4"
num-bigint = "0.4"
pbkdf2 = { version = "0.13", default-features = false }
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-io"] }
qrcode = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
toml = "0.8"
toml_edit = "0.22"
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[build-dependencies]
grammers-tl-parser = "1.2"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "time"] }

[profile.release]
lto = true
