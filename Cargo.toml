[package]
name = "telecli"
version = "0.1.0"
edition = "2021"
description = "Telegram user-account CLI — messages, chats, groups, contacts, privacy, live streaming. No bot tokens."
license = "MIT"
repository = "https://github.com/QMahyar/tele-cli"
homepage = "https://github.com/QMahyar/tele-cli#readme"
keywords = ["telegram", "cli", "mtproto", "messaging", "chat"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
grammers-client = { version = "0.10", features = ["proxy", "parse_invite_link", "markdown", "fs"] }
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
log = "0.4"
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
toml = "0.8"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
