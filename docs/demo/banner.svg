<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#313244"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#cba6f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="200" rx="12" fill="url(#bg)"/>
  <text x="300" y="85" font-family="JetBrains Mono, Fira Code, monospace" font-size="56" font-weight="700" fill="url(#accent)" text-anchor="middle">tele</text>
  <text x="300" y="120" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#cdd6f4" text-anchor="middle" opacity="0.9">Telegram automation from your terminal</text>
  <text x="300" y="155" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" fill="#a6adc8" text-anchor="middle">$ npm install -g @qmahyar/telecli</text>
  <rect x="180" y="170" width="240" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
</svg>
